[project]
name = "llm-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cysimdjson==23.8",
    "daft[ray]>=0.7.16",
    "fasttext>=0.9.3",
    "ftfy>=6.3.1",
    "google-re2>=1.1.20251105",
    "kernels<0.15",
    "magic-html>=0.1.8",
    "py7zr>=1.1.3",
    "resiliparse>=1.0.8",
    "sentence-transformers>=5.6.0",
    "text-dedup>=0.4.1",
    "trafilatura>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.15.22",
]
